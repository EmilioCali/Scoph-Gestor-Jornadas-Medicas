# Los valores con sync: false se solicitan en Render y no se guardan en Git.
# Un solo Web Service: SPA + nginx + cuatro APIs en el mismo contenedor.
# Copia aquí las variables de `.env.example` (raíz). No las subas a Git.
# No pegues API keys ni secretos en este archivo.
services:
  - type: web
    name: scoph
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /auth/api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: VERIFICATION_TOKEN_EXPIRES_MINUTES
        value: "10"
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_APELLIDO
        value: SCOPH
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
