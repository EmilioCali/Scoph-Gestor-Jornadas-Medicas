services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "3020:3020"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3020"
      CORE_SERVICE_URL: http://core-service:3022
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3020/api/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - scoph

  workday-service:
    build:
      context: ./workday-service
    ports:
      - "3021:3021"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3021"
      CORE_SERVICE_URL: http://core-service:3022
    depends_on:
      core-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3021/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - scoph

  core-service:
    build:
      context: ./core-service
    ports:
      - "3022:3022"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3022"
      WORKDAY_SERVICE_URL: http://workday-service:3021
      WORKDAY_SERVICE_HOSTPORT: workday-service:3021
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3022/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - scoph

  report-service:
    build:
      context: ./report-service
    ports:
      - "3023:3023"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3023"
      AUTH_SERVICE_URL: http://auth-service:3020
      AUTH_SERVICE_HOSTPORT: auth-service:3020
      WORKDAY_SERVICE_URL: http://workday-service:3021
      WORKDAY_SERVICE_HOSTPORT: workday-service:3021
      CORE_SERVICE_URL: http://core-service:3022
      CORE_SERVICE_HOSTPORT: core-service:3022
    depends_on:
      auth-service:
        condition: service_healthy
      workday-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3023/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - scoph

networks:
  scoph:
    driver: bridge
